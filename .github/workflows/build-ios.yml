name: Build Unsigned GestaltX IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build without codesign
        run: |
          xcodebuild -project GestaltX.xcodeproj -scheme GestaltX -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO archive -archivePath build/GestaltX.xcarchive
          
      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/GestaltX.xcarchive/Products/Applications/*.app Payload/
          zip -r GestaltX-unsigned.ipa Payload/
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GestaltX-unsigned
          path: GestaltX-unsigned.ipa